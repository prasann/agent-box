[project]
name = "pr-agent"
version = "0.1.0"
description = "AI-powered PR review agent using GitHub Copilot"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1.0",
    "prompt-toolkit>=3.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "github-copilot-sdk>=0.1.20",
]

[project.scripts]
pr-agent = "pr_agent.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
