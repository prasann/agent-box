[project]
name = "meeting-assistant"
version = "0.1.0"
description = "Local Microsoft Teams meeting transcription and question assistant"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
audio = [
    "numpy>=1.26",
    "sounddevice>=0.5",
]
stt = [
    "mlx-whisper>=0.4",
]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.9",
]

[project.scripts]
meeting-assistant = "meeting_assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
